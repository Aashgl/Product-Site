<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telecom Networking Product Catalogue</title>
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --text:#1c2430; --muted:#5d6b7c; --brand:#1f4e78; --line:#dde3ea; --wa:#1fa855; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1b232c; --text:#e8edf2; --muted:#9aa8b8; --brand:#5ea0d6; --line:#2c3743; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--brand); color:#fff; padding:28px 20px; }
  header h1 { margin:0 0 6px; font-size:26px; }
  header p { margin:0; opacity:.9; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .controls input, .controls select { padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:15px; }
  .controls input { flex:1 1 240px; }
  .chips { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .chip { padding:7px 14px; border:1px solid var(--line); border-radius:20px; background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  #count { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .tag { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card h3 { margin:0; font-size:16px; }
  .meta { color:var(--muted); font-size:14px; }
  .spec { font-size:14px; flex:1; }
  .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button.btn, a.btn { padding:9px 14px; border-radius:8px; border:0; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; }
  .primary { background:var(--brand); color:#fff; }
  .wa { background:var(--wa); color:#fff; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.open { display:flex; }
  .box { background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:420px; max-height:92vh; overflow:auto; }
  .box h2 { margin:0 0 4px; font-size:19px; }
  .box .sub { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .box label { display:block; font-size:14px; margin:10px 0 4px; }
  .box input, .box textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit; background:var(--bg); color:var(--text); }
  .box textarea { min-height:80px; resize:vertical; }
  .hp { position:absolute; left:-9999px; }
  #msg { margin-top:10px; font-size:14px; }
  .err { color:#c0392b; } .ok { color:#1e8449; }
  .row { display:flex; gap:8px; margin-top:14px; }
  .ghost { background:transparent; border:1px solid var(--line) !important; color:var(--text); }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>Telecom Networking Product Catalogue</h1>
  <p>OLT, ONT, switches, optics, fiber and ODN. Tap "Request a Quote" on anything you need.</p>
</header>

<main>
  <div class="controls">
    <input id="q" type="search" placeholder="Search by item, make or model">
    <select id="cat"><option value="">All categories</option></select>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-type="">All</button>
    <button class="chip" data-type="Active">Active equipment</button>
    <button class="chip" data-type="Passive">Passive items</button>
  </div>
  <div id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>Prices and availability on request.</footer>

<div class="modal" id="modal">
  <div class="box">
    <h2>Request a Quote</h2>
    <div class="sub" id="pname"></div>
    <label for="f_name">Your name</label>
    <input id="f_name" autocomplete="name">
    <label for="f_phone">Phone / WhatsApp number</label>
    <input id="f_phone" type="tel" autocomplete="tel" placeholder="+91 ...">
    <label for="f_msg">Message (quantity, location, etc.)</label>
    <textarea id="f_msg"></textarea>
    <input class="hp" id="f_web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="msg"></div>
    <div class="row">
      <button class="btn primary" id="send">Send enquiry</button>
      <button class="btn ghost" id="close">Close</button>
    </div>
  </div>
</div>

<script>
  // >>> EDIT THIS: your WhatsApp number with country code, digits only (example: 919876543210).
  // Leave as is to hide the WhatsApp buttons.
  var WHATSAPP_NUMBER = "918851305978";

  var products = [], type = "", current = null;
  var grid = document.getElementById("grid");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function waOn() { return /^\d{10,15}$/.test(WHATSAPP_NUMBER); }
  function waLink(p) {
    var t = "Hi, I'm interested in: " + p.name + (p.make ? " (" + p.make + (p.model ? " " + p.model : "") + ")" : "");
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(t);
  }

  function render() {
    var q = document.getElementById("q").value.toLowerCase().trim();
    var cat = document.getElementById("cat").value;
    var list = products.filter(function (p) {
      if (type && p.type !== type) return false;
      if (cat && p.category !== cat) return false;
      if (!q) return true;
      return (p.name + " " + p.make + " " + p.model + " " + p.key_spec + " " + p.category).toLowerCase().indexOf(q) > -1;
    });
    document.getElementById("count").textContent = list.length + " item" + (list.length === 1 ? "" : "s");
    grid.innerHTML = list.map(function (p) {
      return '<div class="card">' +
        '<div class="tag">' + esc(p.type) + " · " + esc(p.category) + "</div>" +
        "<h3>" + esc(p.name) + "</h3>" +
        '<div class="meta">' + esc(p.make) + (p.model ? " · " + esc(p.model) : "") + "</div>" +
        '<div class="spec">' + esc(p.key_spec) + "</div>" +
        '<div class="actions">' +
        '<button class="btn primary" data-id="' + esc(p.id) + '">Request a Quote</button>' +
        (waOn() ? '<a class="btn wa" target="_blank" rel="noopener" href="' + esc(waLink(p)) + '">WhatsApp</a>' : "") +
        "</div></div>";
    }).join("");
  }

  function load() {
    fetch("/api/products").then(function (r) { return r.json(); }).then(function (data) {
      if (!Array.isArray(data)) throw new Error("bad");
      products = data;
      var cats = [];
      data.forEach(function (p) { if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
      cats.sort();
      document.getElementById("cat").innerHTML = '<option value="">All categories</option>' +
        cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("");
      render();
    }).catch(function () {
      document.getElementById("count").textContent = "Could not load the catalogue. Please refresh.";
    });
  }

  document.getElementById("q").addEventListener("input", render);
  document.getElementById("cat").addEventListener("change", render);
  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    type = b.getAttribute("data-type");
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c === b); });
    render();
  });

  function openModal(p) {
    current = p;
    document.getElementById("pname").textContent = p.name + (p.make ? " (" + p.make + (p.model ? " " + p.model : "") + ")" : "");
    document.getElementById("f_msg").value = "";
    document.getElementById("msg").textContent = "";
    document.getElementById("send").disabled = false;
    document.getElementById("modal").classList.add("open");
  }
  function closeModal() { document.getElementById("modal").classList.remove("open"); }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]"); if (!b) return;
    var id = b.getAttribute("data-id");
    var p = products.filter(function (x) { return String(x.id) === id; })[0];
    if (p) openModal(p);
  });
  document.getElementById("close").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(); });

  document.getElementById("send").addEventListener("click", function () {
    var msg = document.getElementById("msg"), btn = this;
    msg.className = ""; msg.textContent = "Sending...";
    btn.disabled = true;
    fetch("/api/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        product_id: current ? current.id : null,
        name: document.getElementById("f_name").value,
        phone: document.getElementById("f_phone").value,
        message: document.getElementById("f_msg").value,
        website: document.getElementById("f_web").value
      })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          msg.className = "ok";
          msg.textContent = "Thank you! We have received your enquiry and will contact you soon.";
        } else {
          msg.className = "err"; msg.textContent = res.j.error || "Something went wrong."; btn.disabled = false;
        }
      }).catch(function () {
        msg.className = "err"; msg.textContent = "Network error. Please try again."; btn.disabled = false;
      });
  });

  load();
</script>
</body>
</html>
