<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telecom Networking Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2236;--brand:#1f4e78;--acc:#e8912d;--bg:#f2f5f9;--card:#fff;--line:#e2e8ef;--mut:#5b6b7c;--text:#0e2236}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf2;--brand:#5ea0d6;--bg:#0f161d;--card:#18222c;--line:#2a3643;--mut:#9aa8b8;--text:#e8edf2}}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto}.logo i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(232,145,45,.25)}
.btn{padding:10px 16px;border-radius:999px;border:0;cursor:pointer;font:600 14px Manrope,Arial,sans-serif;text-decoration:none;display:inline-block}
.pri{background:var(--acc);color:#1c1200}.wa{background:transparent;color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.hero{background:url(hero.svg) center/cover no-repeat #0b2a47;color:#fff;padding:44px 20px}
.hero h1{margin:0 0 6px;font-size:34px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.45)}.hero p{margin:0;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.wrap{max-width:1280px;margin:0 auto;padding:20px;display:grid;grid-template-columns:270px 1fr;gap:24px}
#nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--text);font:600 14px Manrope,Arial,sans-serif;cursor:pointer;text-align:left}
.row b{font-size:12px;background:var(--bg);border-radius:999px;padding:2px 9px;color:var(--mut)}.row.grp{font-weight:800;margin-top:4px}.row.sub{padding-left:26px;font-weight:400}
.row.on{background:var(--ink);color:var(--card)}.row.on b{background:var(--acc);color:#1c1200}
h2{margin:0 0 12px;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.02em}h2 small{color:var(--mut);font-size:18px;font-weight:600;letter-spacing:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
#q{flex:1 1 240px;max-width:420px;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:400 15px Manrope,Arial,sans-serif}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}.chip{white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font:600 14px Manrope,Arial,sans-serif}.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .ico{height:150px;border-radius:12px;background:var(--bg);margin:0 0 6px}.card .ico svg{width:96px;height:96px}.ico.photo img{width:100%;height:100%;object-fit:contain}
.tag{align-self:flex-start;font-size:12px;font-weight:800;color:var(--acc);background:rgba(232,145,45,.14);border-radius:999px;padding:4px 12px;margin-top:4px}
.card h3{margin:2px 0 0;font-size:17px;font-weight:800}.meta{color:var(--mut);font-size:13px}.spec{margin:0;font-size:14px;color:var(--mut);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;gap:8px;margin-top:8px}.act .pri{flex:1}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#1fa855;color:#fff;padding:14px 20px;border-radius:999px;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.open{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:430px;max-height:92vh;overflow:auto}.box h2{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin-bottom:8px}
.box label{display:block;font-size:14px;margin:10px 0 4px}.box input,.box textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:400 15px Manrope,Arial,sans-serif;background:var(--bg);color:var(--text)}.box textarea{min-height:80px}
.hp{position:absolute;left:-9999px}#msg{margin-top:10px;font-size:14px}.err{color:#c0392b}.ok{color:#1e8449}.rw{display:flex;gap:8px;margin-top:14px}.pv{background:#fff3cd;color:#5c4a00;text-align:center;font-size:13px;padding:6px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}#nav{display:none}h2{font-size:30px}.hero h1{font-size:26px}}
</style></head><body>

<div class="top"><div class="logo"><i></i>Telecom Catalogue</div><a class="btn wa" id="topwa" target="_blank" rel="noopener">WhatsApp</a><button class="btn pri" id="gq">Get a quote</button></div>
<header class="hero"><h1>Fibre and networking equipment</h1><p>OLT, ONT, switches, optics, fibre and ODN. Pick an item and ask for a quote.</p></header>
<div class="wrap"><aside id="nav"></aside><main><h2 id="ttl"></h2>
<div class="tools"><input id="q" type="search" placeholder="Search by item, make or model"></div>
<div class="chips" id="chips"></div><div class="grid" id="grid"></div></main></div>
<a class="fab" id="fab" target="_blank" rel="noopener">WhatsApp us</a>
<div class="modal" id="modal"><div class="box"><h2>Get a quote</h2><div class="sub" id="pname"></div>
<label for="f_name">Your name</label><input id="f_name" autocomplete="name">
<label for="f_phone">Phone / WhatsApp number</label><input id="f_phone" type="tel" autocomplete="tel" placeholder="+91 ...">
<label for="f_msg">Message (quantity, location, etc.)</label><textarea id="f_msg"></textarea>
<input class="hp" id="f_web" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="msg"></div>
<div class="rw"><button class="btn pri" id="send">Send enquiry</button><button class="btn ghost" id="close">Close</button></div></div></div>

<script>
// >>> EDIT THIS: your WhatsApp number, country code + digits only (example: 919876543210)
var WA="91XXXXXXXXXX";
var all=[],type="",cat="",cur=null;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var waOk=/^\d{10,15}$/.test(WA);
var waUrl=function(t){return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)};
var LBL={Active:"Active equipment",Passive:"Passive items"};
function cats(t){var m={};all.forEach(function(p){if(!t||p.type===t)m[p.category]=(m[p.category]||0)+1});return m}
function nav(){
  var h='<button class="row'+(!type&&!cat?" on":"")+'" data-t="" data-c=""><span>All items</span><b>'+all.length+'</b></button>';
  ["Active","Passive"].forEach(function(t){var m=cats(t),n=all.filter(function(p){return p.type===t}).length;if(!n)return;
    h+='<button class="row grp'+(type===t&&!cat?" on":"")+'" data-t="'+t+'" data-c=""><span>'+LBL[t]+'</span><b>'+n+'</b></button>';
    if(type===t)Object.keys(m).sort().forEach(function(c){h+='<button class="row sub'+(cat===c?" on":"")+'" data-t="'+t+'" data-c="'+esc(c)+'"><span>'+esc(c)+'</span><b>'+m[c]+'</b></button>'})});
  $("#nav").innerHTML=h;
  var m2=cats(type),c='<button class="chip'+(!cat?" on":"")+'" data-t="'+type+'" data-c="">'+(type?"All "+LBL[type].toLowerCase():"All")+'</button>';
  if(type)Object.keys(m2).sort().forEach(function(k){c+='<button class="chip'+(cat===k?" on":"")+'" data-t="'+type+'" data-c="'+esc(k)+'">'+esc(k)+'</button>'});
  else c+='<button class="chip" data-t="Active" data-c="">Active equipment</button><button class="chip" data-t="Passive" data-c="">Passive items</button>';
  $("#chips").innerHTML=c;
}
function render(){
  var q=$("#q").value.toLowerCase().trim();
  var list=all.filter(function(p){if(type&&p.type!==type)return false;if(cat&&p.category!==cat)return false;
    return !q||(p.name+" "+p.make+" "+p.model+" "+p.key_spec+" "+p.category).toLowerCase().indexOf(q)>-1});
  $("#ttl").innerHTML=esc(cat||(type?LBL[type]:"All items"))+". <small>"+list.length+" item"+(list.length===1?"":"s")+"</small>";
  $("#grid").innerHTML=list.map(function(p){var t="Hi, I'm interested in: "+p.name+(p.make?" ("+p.make+(p.model?" "+p.model:"")+")":"");
    return '<article class="card">'+(p.image_url?'<div class="ico photo"><img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy"></div>':"")+
    '<span class="tag">'+esc(p.category)+'</span><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.make)+(p.model?" · "+esc(p.model):"")+'</div><p class="spec">'+esc(p.key_spec)+'</p>'+
    '<div class="act"><button class="btn pri" data-id="'+esc(p.id)+'">Get a quote</button>'+(waOk?'<a class="btn wa" target="_blank" rel="noopener" href="'+esc(waUrl(t))+'">WhatsApp</a>':"")+'</div></article>'}).join("");
}
function pick(e){var b=e.target.closest("[data-t]");if(!b)return;type=b.getAttribute("data-t");cat=b.getAttribute("data-c");nav();render()}
$("#nav").addEventListener("click",pick);$("#chips").addEventListener("click",pick);$("#q").addEventListener("input",render);
if(waOk){$("#topwa").href=waUrl("Hi, I'd like a quote");$("#fab").href=waUrl("Hi, I'd like a quote")}else{$("#topwa").style.display="none";$("#fab").style.display="none"}
function openM(p){cur=p;$("#pname").textContent=p?p.name+(p.make?" ("+p.make+(p.model?" "+p.model:"")+")":""):"Tell us what you need and we will reply with a quote.";$("#f_msg").value="";$("#msg").textContent="";$("#send").disabled=false;$("#modal").classList.add("open")}
$("#grid").addEventListener("click",function(e){var b=e.target.closest("button[data-id]");if(!b)return;var id=b.getAttribute("data-id");openM(all.filter(function(x){return String(x.id)===id})[0])});
$("#gq").addEventListener("click",function(){openM(null)});$("#close").addEventListener("click",function(){$("#modal").classList.remove("open")});
$("#send").addEventListener("click",function(){var m=$("#msg"),b=this;m.className="";m.textContent="Sending...";b.disabled=true;
  fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:cur?cur.id:null,name:$("#f_name").value,phone:$("#f_phone").value,message:$("#f_msg").value,website:$("#f_web").value})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){if(x.ok){m.className="ok";m.textContent="Thank you! We have your enquiry and will contact you soon."}else{m.className="err";m.textContent=x.j.error||"Something went wrong.";b.disabled=false}})
  .catch(function(){m.className="err";m.textContent="Network error. Please try again.";b.disabled=false})});
fetch("/api/products").then(function(r){return r.json()}).then(function(d){if(!Array.isArray(d))throw 0;all=d;nav();render()}).catch(function(){$("#ttl").textContent="Could not load the catalogue. Please refresh."});
</script>
<script src="icons.js"></script>
</body></html>
